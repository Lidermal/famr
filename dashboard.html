<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FAMR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-famr sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <img src="https://raw.githubusercontent.com/[SEU_USUARIO]/famrlogo/main/famrlogo.png" alt="FAMR" class="navbar-logo">
                <span>FAMR</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <input type="text" class="form-control search-militar" id="searchMilitar" placeholder="Procurar militar...">
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle"></i> <span id="userDisplay">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="perfil.html"><i class="fas fa-id-card"></i> Meu Perfil</a></li>
                            <li><a class="dropdown-item" href="#" id="adminPanelBtn"><i class="fas fa-cog"></i> Painel Admin</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alerta de Manutenção -->
    <div id="maintenanceAlert" class="alert alert-warning alert-dismissible fade show" role="alert" style="display:none;">
        <strong>Sistema em Manutenção!</strong> O sistema está em manutenção. Apenas administradores podem acessar.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Container Principal -->
    <div class="container-fluid dashboard-container">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 sidebar-famr">
                <div class="card card-famr">
                    <div class="card-header card-famr-header">
                        <h5><i class="fas fa-bars"></i> Menu</h5>
                    </div>
                    <div class="card-body p-0">
                        <nav class="nav flex-column" id="sidebarMenu">
                            <!-- Menu será preenchido dinamicamente -->
                        </nav>
                    </div>
                </div>

                <!-- Grupos do Usuário -->
                <div class="card card-famr mt-3">
                    <div class="card-header card-famr-header">
                        <h5><i class="fas fa-shield-alt"></i> Meus Grupos</h5>
                    </div>
                    <div class="card-body" id="userGroupsList">
                        <!-- Grupos serão preenchidos dinamicamente -->
                    </div>
                </div>
            </div>

            <!-- Conteúdo Principal -->
            <div class="col-lg-9">
                <!-- Boas-vindas -->
                <div class="card card-famr mb-4">
                    <div class="card-body">
                        <h4><i class="fas fa-home"></i> Bem-vindo, <span id="userWelcome">Militar</span>!</h4>
                        <p class="text-muted">Última atualização: <span id="lastUpdate">Carregando...</span></p>
                    </div>
                </div>

                <!-- Tópicos/Seções Dinâmicas -->
                <div id="topicsContainer">
                    <!-- Tópicos serão preenchidos dinamicamente baseado nos grupos -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para visualizar tópico -->
    <div class="modal fade" id="topicModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="topicModalTitle">Tópico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="topicModalBody">
                    <!-- Conteúdo será preenchido dinamicamente -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
